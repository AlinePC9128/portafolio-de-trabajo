services:
  app:
    image: php:8.3-cli
    working_dir: /app
    volumes: [".:/app"]
    ports: ["8080:8080"]
    command: php -S 0.0.0.0:8080 -t public
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: leads_demo
      MYSQL_ROOT_PASSWORD: demo_root_password
    ports: ["3307:3306"]
    volumes: ["./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql"]
